<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>I dag — norsk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#f3f4f7; --surface:#ffffff; --ink:#1b1e26; --muted:#5b6270; --line:#e3e6ec;
    --accent:#2c4a78; --code:#eef1f6; --ok:#1f7a5c; --gram:#a8630f; --talk:#3f56b0; --mock:#8a3ea0;
    --shadow:0 1px 2px rgba(20,24,40,.06),0 4px 16px rgba(20,24,40,.05);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#14161b; --surface:#1c2028; --ink:#eceef2; --muted:#98a0af; --line:#2b303b;
      --accent:#9db8e6; --code:#12151c; --ok:#5fc4a2; --gram:#e0a552; --talk:#93a3ee; --mock:#c98fdd;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.28);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161b; --surface:#1c2028; --ink:#eceef2; --muted:#98a0af; --line:#2b303b;
    --accent:#9db8e6; --code:#12151c; --ok:#5fc4a2; --gram:#e0a552; --talk:#93a3ee; --mock:#c98fdd;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.28);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg); color:var(--ink); font-family:"Public Sans",system-ui,sans-serif; line-height:1.5; padding:16px 16px 56px; -webkit-text-size-adjust:100%}
  .wrap{max-width:620px; margin:0 auto; display:flex; flex-direction:column; gap:18px}
  [hidden]{display:none!important}

  .top{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .top h1{font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:1.35rem; margin:0}
  .progress{display:grid; grid-template-columns:repeat(12,1fr); gap:3px; flex:1 1 auto; max-width:220px}
  .progress span{height:6px; border-radius:3px; background:var(--line)}
  .progress span.part{background:var(--gram)} .progress span.full{background:var(--ok)} .progress span.now{outline:2px solid var(--accent); outline-offset:1px}

  .week{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow)}
  .week .nav{display:flex; align-items:center; justify-content:space-between; gap:8px}
  .week .eyebrow{font-size:.76rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
  .week h2{font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:1.6rem; margin:2px 0 10px; line-height:1.1; text-wrap:balance}
  .iconbtn{background:none; border:1px solid var(--line); border-radius:8px; color:var(--accent); font:600 .9rem "Public Sans",sans-serif; padding:4px 10px; cursor:pointer; min-height:32px}
  .days{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
  .day{border:1px solid var(--line); border-radius:9px; padding:7px 3px; text-align:center; font-size:.7rem; line-height:1.2; color:var(--muted); background:none; font-family:inherit; cursor:pointer; min-height:44px}
  .day b{display:block; font-size:.84rem; color:var(--ink)}
  .day.done{border-color:var(--ok); color:var(--ok)} .day.done b{color:var(--ok)}
  .day.now{border-color:var(--accent); border-width:2px; color:var(--accent)} .day.now b{color:var(--accent)}
  .day.talk{background:var(--code)}
  .day:focus-visible,.btn:focus-visible,.iconbtn:focus-visible,summary:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  .today{background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); overflow:hidden}
  .today header{padding:14px 16px 12px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
  .tag{font-size:.72rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:3px 8px; border-radius:6px; color:#fff; background:var(--gram)}
  .tag.talk{background:var(--talk)} .tag.mock{background:var(--mock)}
  .today header h3{font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:1.22rem; margin:0; flex:1 1 auto; text-wrap:balance}
  .today header .min{color:var(--muted); font-size:.9rem; font-variant-numeric:tabular-nums}
  .step{padding:14px 16px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:8px}
  .step .lbl{display:flex; align-items:center; gap:9px; font-size:.76rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
  .step .lbl .n{width:22px; height:22px; border-radius:7px; display:inline-grid; place-items:center; background:var(--code); color:var(--ink); font-size:.78rem}
  .step p{margin:0}
  .rule{border-left:3px solid var(--gram); padding-left:12px; display:flex; flex-direction:column; gap:5px}
  .pat{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.84rem; background:var(--code); padding:6px 9px; border-radius:7px; word-break:break-word}
  .note{font-size:.84rem; color:var(--muted)}
  audio{width:100%; height:40px}
  .txt{font-size:.98rem; line-height:1.6}
  .txt mark{background:none; color:var(--gram); font-weight:700; text-decoration:underline; text-decoration-color:var(--gram); text-decoration-thickness:2px}
  ul.ord{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:6px; font-size:.95rem}
  ul.ord .gloss{color:var(--muted)} ul.ord .ex{color:var(--ink); font-style:italic}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin:0}
  .chips span{background:var(--code); border:1px solid var(--line); border-radius:999px; padding:2px 10px; font-size:.85rem}
  .q{font-family:"Fraunces",Georgia,serif; font-size:1.15rem; font-weight:600; text-wrap:balance}
  ol.drill{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:8px}
  ol.drill li .hint{color:var(--muted); font-style:italic}
  ol.drill details{display:inline}
  ol.drill summary{display:inline; cursor:pointer; color:var(--accent); font-size:.85rem; font-weight:600; margin-left:6px; list-style:none}
  ol.drill summary::-webkit-details-marker{display:none}
  ol.drill details[open] summary{display:none}
  ol.drill .fasit{color:var(--ok); font-weight:600}
  pre{margin:0; background:var(--code); border:1px solid var(--line); border-radius:9px; padding:10px 12px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.8rem; line-height:1.5; white-space:pre-wrap; word-break:break-word}
  .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  .btn{background:var(--accent); color:#fff; border:0; border-radius:9px; padding:9px 16px; font:600 .88rem "Public Sans",sans-serif; cursor:pointer; min-height:40px}
  .btn.ghost{background:none; color:var(--accent); border:1px solid var(--line)}
  .btn.done{background:var(--ok); font-size:1rem; padding:12px 18px; width:100%}
  .btn.undo{background:none; color:var(--muted); border:1px solid var(--line)}
  .timer{font-variant-numeric:tabular-nums; font-weight:700; font-size:1.3rem; min-width:64px}
  .foot{padding:14px 16px; background:var(--code); display:flex; flex-direction:column; gap:8px}
  .foot .next{font-size:.88rem; color:var(--muted)} .foot .next b{color:var(--ink)}
  details.more{border-top:1px solid var(--line); padding:10px 16px}
  details.more summary{cursor:pointer; color:var(--accent); font-size:.85rem; font-weight:600}
  details.more .in{padding-top:10px; display:flex; flex-direction:column; gap:8px}
  .obox{display:flex; flex-direction:column; gap:6px; font-size:.95rem}
  textarea{width:100%; min-height:110px; border:1px solid var(--line); border-radius:9px; padding:10px; font:inherit; font-size:.9rem; background:var(--surface); color:var(--ink); resize:vertical}
  footer{color:var(--muted); font-size:.82rem; text-align:center}
  @media (prefers-reduced-motion:no-preference){ .day,.progress span{transition:all .15s} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>I dag</h1>
    <div class="progress" id="progress" aria-label="12 uker"></div>
  </div>

  <section class="week" aria-label="Uke">
    <div class="nav">
      <button class="iconbtn" id="prevw" type="button" aria-label="Forrige uke">‹</button>
      <div class="eyebrow" id="weekEyebrow"></div>
      <button class="iconbtn" id="nextw" type="button" aria-label="Neste uke">›</button>
    </div>
    <h2 id="weekTitle"></h2>
    <div class="days" id="days" role="tablist" aria-label="Dager"></div>
  </section>

  <article class="today" id="today"></article>

  <footer>Innholdet kommer fra <code>norsk_daily</code>. Framdrift lagres bare i denne nettleseren.</footer>
</div>

<script>
const DATA = {"plan": {"1": {"theme": 4, "title": "Jobb og utdanning"}, "7": {"theme": 7, "title": "Innvandring, språk og kultur"}, "2": {"theme": 3, "title": "Barn og skole"}, "8": {"theme": 8, "title": "Miljø, forbruk og penger"}, "3": {"theme": 5, "title": "Sosiale medier og mobil"}, "9": {"theme": 9, "title": "Lykke og verdier"}, "4": {"theme": 2, "title": "Kropp, helse og form"}, "10": {"theme": 10, "title": "Fritid, natur og kjæledyr"}, "5": {"theme": 1, "title": "Mat og kosthold"}, "11": {"theme": null, "title": "Repetisjon: de fem mønstrene med flest feil i loggen"}, "6": {"theme": 6, "title": "Venner og naboer"}, "12": {"theme": null, "title": "Repetisjon: mock A/B/C på tilfeldige tema"}}, "themes": {"1": {"n": 1, "title": "Mat og kosthold", "oversikt": ["Hva det handler om: sunn og usunn mat, hva vi spiser i hverdagen, og om folk er for opptatt av kropp og helse.", "Nøkkelord: godteri, brus, chips, ferdigmat, sukker, fett, salt · grønnsaker, fisk, hjemmelaget mat · kosthold, vaner.", "Balanse (C): sunn mat er bra for helsa, men for mye press om utseende og dietter er ikke bra.", "Chunks: «Jeg prøver å…» · «Jeg er enig med deg om at…» · «Det kommer an på…» · «Alt i alt…»", "Om meg (bruk dette): Kjøtt er veldig viktig for oss, så vi drar ofte til Sverige for å handle. Norsk ost har lite smak og er dyr, så vi kjøper Happy Cow-ost i Sverige — den smaker bedre. Vi lager mat hjemme nesten hver dag, fordi det er dyrt å spise ute i Norge.", "B — Hva slags mat er dårlig? · godteri/brus, chips, ferdigmat; vi lager mat hjemme, handler kjøtt og ost i Sverige", "C — Er folk for opptatt av sunn mat? · sunt er bra vs press om utseende; anker i meg: trening og mat"], "questions": [{"form": "B", "q": "Hva slags mat er dårlig?", "angle": "godteri/brus, chips, ferdigmat; vi lager mat hjemme, handler kjøtt og ost i Sverige"}, {"form": "C", "q": "Er folk for opptatt av sunn mat?", "angle": "sunt er bra vs press om utseende; anker i meg: trening og mat"}], "answers": {"01-1": {"form": "B", "q": "Hva slags mat er dårlig?", "text": "Jeg synes at godteri, brus og chips er dårlig mat. Det er mye sukker, fett og salt i det, og man blir ikke mett. Ferdigmat er også dårlig, fordi det er mye salt og lite grønnsaker i den. Men jeg forstår at folk kjøper den når de er slitne etter jobb. Hjemme lager vi mat nesten hver dag. Det er dyrt å spise ute i Norge, og når vi lager maten selv, vet vi hva som er i den. For eksempel lager jeg mat med mye protein, kjøtt, linser og grønnsaker, men den må smake godt. Kjedelig mat fungerer ikke i lengden. Jeg er enig med deg i at sukker er det største problemet. Hva synes du, er ferdigmat alltid dårlig, eller kan den være greit noen ganger?"}, "01-2": {"form": "C", "q": "Er folk for opptatt av sunn mat?", "text": "Ja, jeg synes at det er bra at folk tenker på sunn mat, men det kommer an på hvor opptatt man er. Det mener jeg fordi maten påvirker helsa vår hver dag. Hvis man spiser mye sukker og fett, blir man sliten og kan bli syk. Hvis man spiser sunt, får man mer energi til jobb og familie. For eksempel lager vi mat hjemme nesten hver dag. Det er dyrt å spise ute i Norge, og når vi lager maten selv, vet vi hva som er i den. Kjøtt er viktig for oss, så vi drar ofte til Sverige for å handle. Der kjøper vi også ost, fordi norsk ost har lite smak og er dyr. Osten fra Sverige smaker bedre. I tillegg lager jeg mat med mye protein, men den må smake godt. Kjedelig mat fungerer ikke i lengden, for da gir man opp etter to uker. På den andre siden blir noen for opptatt av dietter og utseende. De teller kalorier hele tiden og gleder seg ikke over maten. Det er ikke sunt for hodet. Barn ser også hva foreldrene gjør, så vi må vise dem at mat er noe godt, ikke noe farlig. Alt i alt handler det om balanse. Sunn mat i hverdagen, og godteri bare i helgen. Det fungerer for oss."}}}, "2": {"n": 2, "title": "Kropp, helse og form", "oversikt": ["Hva det handler om: det norske helsevesenet, trening og fysisk aktivitet, og om folk er for opptatt av kropp.", "Nøkkelord: fastlege, legevakt, tannlege, gravid, antibiotika, Paracet, ventetid · gym, push-ups, planke, kjernemuskulatur, protein · fysisk og mental helse.", "Balanse (C): kropp vs sjel — fysisk helse er viktig, men mental helse og hvile er like viktig.", "Chunks: «Alt i alt er jeg fornøyd med…, selv om…» · «For eksempel trener jeg…» · «Det er bra for helsa fordi…»", "Om meg (bruk dette): Jeg trener på gym tre ganger i uka. Nå trener jeg lett — push-ups, pull-ups med hjelp og planke i hver økt for å styrke kjernemuskulaturen. Hjemme lager jeg sunn mat med mye protein, men den må smake godt, fordi kjedelig mat fungerer ikke i lengden. Helsevesenet: gratis for barn og for gravide, det er bra. Men tannlege er veldig dyrt, og det er ikke lett å få antibiotika — de gir deg bare Paracet og sier «vent til feberen går over». Det er annerledes enn i hjemlandet mitt.", "B — Det norske helsevesenet · gratis for barn og gravide; men dyr tannlege, vanskelig å få antibiotika, bare Paracet", "C — Opptatt av kropp og helse? · kropp vs sjel", "B — Hvilken trening liker du og liker ikke? (Elis liste) · gym 3x i uka, push-ups, pull-ups, planke i hver økt; spør tilbake", "A — Er det vanlig å trene i hjemlandet mitt? (Elis liste) · cricket, gå tur, mindre gym-kultur", "C — Hvilken sport liker nordmenn? / Folk som ser sport på TV (Elis liste) · ski, fotball, langrenn; sandwich: jeg ser selv…"], "questions": [{"form": "B", "q": "Det norske helsevesenet", "angle": "gratis for barn og gravide; men dyr tannlege, vanskelig å få antibiotika, bare Paracet"}, {"form": "C", "q": "Opptatt av kropp og helse?", "angle": "kropp vs sjel"}, {"form": "B", "q": "Hvilken trening liker du og liker ikke? (Elis liste)", "angle": "gym 3x i uka, push-ups, pull-ups, planke i hver økt; spør tilbake"}, {"form": "A", "q": "Er det vanlig å trene i hjemlandet mitt? (Elis liste)", "angle": "cricket, gå tur, mindre gym-kultur"}, {"form": "C", "q": "Hvilken sport liker nordmenn? / Folk som ser sport på TV (Elis liste)", "angle": "ski, fotball, langrenn; sandwich: jeg ser selv…"}], "answers": {"02-1": {"form": "B", "q": "Det norske helsevesenet", "text": "Alt i alt er jeg fornøyd med helsevesenet i Norge, selv om det ikke er perfekt. Det som er bra, er at det er gratis for barn og for kvinner som er gravide. Da vi ventet babyen vår, fikk vi god oppfølging på sykehuset, og det kostet ingenting. På den andre siden er tannlege veldig dyrt, og det er vanskelig å få antibiotika. Når man er syk, sier legen ofte bare «ta Paracet og vent til feberen går over». I hjemlandet mitt er det annerledes. Der får man medisin med en gang, kanskje for mye. Så begge systemer har fordeler og ulemper. Selv passer jeg på helsa ved å trene tre ganger i uka, så jeg trenger ikke legen så ofte. Hva synes du om fastlegen din? Får du hjelp når du trenger det?"}, "02-2": {"form": "C", "q": "Opptatt av kropp og helse?", "text": "Ja, jeg synes at det er bra at folk er opptatt av kropp og helse, men det må være balanse. Det mener jeg fordi kroppen og hodet henger sammen. Hvis kroppen er i form, blir hodet også roligere, og man takler stress bedre på jobb og hjemme. For eksempel trener jeg på gym tre ganger i uka. Nå trener jeg lett, med push-ups, pull-ups med hjelp og planke i hver økt for å styrke kjernemuskulaturen. Jeg trenger ikke tunge vekter, det viktigste er at jeg gjør det regelmessig. I tillegg lager jeg sunn mat hjemme med mye protein. Men maten må smake godt, ellers holder man ikke ut i lengden. Kjedelig mat fungerer i to uker, og så gir man opp. På den andre siden er mental helse like viktig som fysisk helse. Noen trener hver dag, men de er stresset og sover dårlig. Da hjelper ikke treningen så mye. Man må også ha tid til familie, venner og hvile. Selv måtte jeg være sykmeldt en gang på grunn av spenningshodepine, fordi jeg jobbet for mye. Da lærte jeg at hodet trenger pauser like mye som kroppen trenger trening. Alt i alt synes jeg at det er bra å være opptatt av helse, så lenge det ikke blir et press. Trening, god mat og nok søvn, det er nok for de fleste."}, "02-3": {"form": "B", "q": "Hvilken trening liker du og liker ikke? (Elis liste)", "text": "Jeg liker å trene på gym, og jeg går dit tre ganger i uka. Nå trener jeg lett, for eksempel push-ups, pull-ups med hjelp og planke. Planke har jeg i hver økt, fordi det styrker kjernemuskulaturen, og det hjelper mot ryggsmerter når man sitter mye på jobb. Jeg liker gym fordi det ligger i nærheten, og fordi jeg kan trene uansett vær. Om vinteren er det mørkt og kaldt ute, så det er lettere å gå inn på gymmet. Det jeg ikke liker, er å løpe langt. Det er kjedelig for meg, og knærne blir vonde. Jeg liker heller å gå tur med barna i helgene, det er trening og familietid på samme tid. Hva slags trening liker du? Trener du inne eller ute?"}, "02-4": {"form": "A", "q": "Er det vanlig å trene i hjemlandet mitt? (Elis liste)", "text": "I hjemlandet mitt, Pakistan, er det ikke så vanlig å gå på gym som i Norge. Det er ikke like mange treningssentre, og de som finnes, er mest i store byer. Folk trener på andre måter. Mange spiller cricket i gatene og i parkene, spesielt unge gutter. Det er den store sporten hjemme. Andre går tur om kvelden, fordi det er for varmt om dagen. Om sommeren kan det være over førti grader, så man kan ikke trene ute midt på dagen. Eldre går ofte tur i parken om morgenen før det blir varmt. Da jeg bodde i Pakistan, spilte jeg cricket med venner og gikk mye. Jeg gikk ikke på gym da. I Norge er det annerledes. Gymmet ligger i nærheten, det er åpent hele dagen, og det er varmt inne om vinteren. Derfor har jeg trent mer i Norge enn i hjemlandet. Nå går jeg tre ganger i uka og trener lett, med push-ups, pull-ups og planke. I tillegg ser jeg at nordmenn er veldig aktive ute. De går på ski, går tur i skogen og sykler til jobb. Det er en del av kulturen her. I Pakistan er trening mer noe man gjør sammen med venner, som cricket. I Norge er det mer noe man gjør for helsa. Alt i alt tror jeg at begge deler er bra. Det viktigste er at man beveger seg."}, "02-5": {"form": "C", "q": "Hvilken sport liker nordmenn? / Folk som ser sport på TV (Elis liste)", "text": "Jeg tror at nordmenn liker ski, langrenn og fotball best. Om vinteren ser man mange på ski i skogen, både barn og eldre, og på TV går det skirenn hver helg. Om sommeren spiller barna fotball, og mange voksne ser på fotball på TV, både norsk og engelsk. Selv ser jeg ikke så mye sport på TV. Jeg har ikke så mye tid med to små barn, og når jeg har fri, vil jeg heller trene selv eller være med familien. Men jeg synes at det er bra at folk har en hobby de er interessert i. Når man ser sport sammen med venner eller familie, blir det sosialt. Man snakker, spiser sammen og har det hyggelig. Det er positivt. På den andre siden er det bedre å trene selv enn å bare sitte og se på. Hvis man ser fotball tre timer hver kveld, sitter man stille og spiser chips. Da blir det usunt. Jeg tror at balansen er viktig. Man kan se en kamp i helgen, men man bør også gå tur eller trene selv i uka. I Pakistan ser folk mye cricket på TV, hele familien sitter sammen. Det er en fin tradisjon, men også der ser folk mer enn de spiller. Alt i alt synes jeg at det er greit å se sport på TV, så lenge man også bruker kroppen selv."}}}, "3": {"n": 3, "title": "Barn og skole", "oversikt": ["Hva det handler om: barnehage, om barn skal hjelpe til hjemme, lekser og karakterer.", "Nøkkelord: barnehage, venner, energi, frustrert, rutiner · leke familie, bake, lage mat, hjelpe til · nyttig, kreativ, ansvar, lekser.", "Balanse (C): barn lærer ansvar av å hjelpe, men ikke for mye — de må også leke og gjøre lekser.", "Chunks: «Det mener jeg fordi barn lærer…» · «Hvis barn hjelper til, blir de…» · «På den andre siden…»", "Om meg (bruk dette): Jeg har to barn — en datter på fem år og en baby på ni måneder — så jeg har ingen erfaring med skole enda. Barnehage er viktig fordi barn får mye tid med venner og får brukt energien sin. Barn har veldig mye energi. Det merker man om sommeren og i helgene, når de er hjemme og ikke kan gå ut — da blir de frustrerte. Barn elsker å gjøre det de ser foreldrene gjør: de leker familie når det er en baby i huset, og de leker baking og matlaging når vi lager mat. Derfor gir det mening å la dem hjelpe til hjemme — de gjør det allerede i leken, og de føler seg nyttige og kreative når de får være med.", "C — Er det viktig at barn går i barnehage? · venner + få brukt energien (merkes om sommeren/helger); språk; mot: noen barn er små", "C — Må barn hjelpe til hjemme? · barn leker allerede det foreldrene gjør → la dem være med; nyttig, kreativ; vs fri lek", "C — Skal barn hjelpe voksne med husarbeid? · samme balanse, andre ord"], "questions": [{"form": "C", "q": "Er det viktig at barn går i barnehage?", "angle": "venner + få brukt energien (merkes om sommeren/helger); språk; mot: noen barn er små"}, {"form": "C", "q": "Må barn hjelpe til hjemme?", "angle": "barn leker allerede det foreldrene gjør → la dem være med; nyttig, kreativ; vs fri lek"}, {"form": "C", "q": "Skal barn hjelpe voksne med husarbeid?", "angle": "samme balanse, andre ord"}], "answers": {"03-1": {"form": "C", "q": "Er det viktig at barn går i barnehage?", "text": "Ja, jeg synes at det er viktig at barn går i barnehage. Det mener jeg fordi barn lærer mye der som de ikke lærer hjemme. Først og fremst får de venner. De lærer å dele, å vente på tur og å løse små konflikter. I tillegg lærer de språket. For oss som er innvandrere, er det spesielt viktig. Hjemme snakker vi morsmålet vårt, men i barnehagen hører datteren vår norsk hele dagen, og hun lærer det raskt. For eksempel har datteren min på fem år veldig mye energi. I barnehagen får hun brukt den. Hun løper, klatrer og leker ute i alle slags vær. Det merker vi om sommeren og i helgene, når hun er hjemme og ikke kan gå ut. Da blir hun frustrert, fordi energien må ut et sted. Barnehagen gir henne også rutiner. Hun vet når det er mat, når det er utetid og når det er hviletid. Det gjør henne roligere hjemme også. På den andre siden er noen barn veldig små når de begynner. Babyen vår er ni måneder, og jeg synes at det er tidlig å begynne i barnehage før ett år. Små barn trenger foreldrene sine. Noen barn blir også ofte syke det første året. Alt i alt er barnehage bra for barna, både for språket, for vennene og for energien. Men det bør ikke være for tidlig, og dagene bør ikke være for lange."}, "03-2": {"form": "C", "q": "Må barn hjelpe til hjemme?", "text": "Ja, jeg synes at barn skal hjelpe til hjemme, men på sin egen måte. Det mener jeg fordi barn elsker å gjøre det de ser foreldrene gjør. Hvis man ser på hva barn leker, ser man at de leker det vi gjør i hverdagen. For eksempel leker datteren min på fem år at hun baker og lager mat, fordi hun ser at vi lager mat hjemme nesten hver dag. Hun leker også familie med dukkene sine, fordi vi har en baby på ni måneder i huset. Derfor gir det mening å la henne hjelpe til for ekte. Når vi baker, får hun blande deigen. Når vi rydder, får hun legge lekene sine på plass. Da føler hun seg nyttig, og hun får brukt energien sin på noe. I tillegg lærer barn ansvar av små oppgaver. De lærer at ting ikke kommer av seg selv, og at alle i familien bidrar. Det tar mer tid for oss som foreldre. Det går fortere å lage mat alene. Men det er for utviklingen hennes, så vi finner den tiden. På den andre siden må barn også få tid til å leke fritt. De skal ikke ha lange lister med plikter. Oppgavene må passe alderen, og det skal være gøy, ikke et press. Alt i alt er litt husarbeid bra for barn. De gjør det allerede i leken, så la dem være med."}, "03-3": {"form": "C", "q": "Skal barn hjelpe voksne med husarbeid?", "text": "Ja, jeg synes at barn skal hjelpe voksne med husarbeid, men det må passe alderen. Det mener jeg fordi barn allerede leker det vi gjør. Hvis man ser på leken deres, ser man hverdagen vår. For eksempel leker datteren min familie når babyen er i huset. Hun mater dukken, legger den til å sove og trøster den. Og når vi lager mat, leker hun at hun baker. Derfor gir det mening å la henne være med for ekte. Hun får blande deigen når vi baker, og hun får legge lekene på plass når vi rydder. Da føler hun seg nyttig og kreativ, og hun får brukt energien sin. I tillegg lærer barn ansvar. De lærer at huset er alles ansvar, ikke bare mammas eller pappas. Det tar mer tid for oss. Det er fortere å gjøre det selv. Men det er for utviklingen hennes, så vi finner den tiden. Jeg husker fra Pakistan at barna hjalp mye hjemme, kanskje for mye noen ganger. I Norge er det kanskje litt mindre. Jeg tror at midten er best. På den andre siden må oppgavene passe alderen. En femåring kan ikke støvsuge hele huset, men hun kan bære sin egen teller til kjøkkenet. Og det skal være gøy, ikke et press. Barn trenger også tid til fri lek. Alt i alt er det bra for utviklingen at barn hjelper til, så lenge det er små oppgaver og god stemning."}}}, "4": {"n": 4, "title": "Jobb og utdanning", "oversikt": ["Hva det handler om: utdanning vs erfaring, jobbe mye eller lite, 4-dagers uke, lønn og skatt.", "Nøkkelord: utdanning, erfaring, maskiningeniør, utvikling, selvstendighet · remote, hjemmekontor, kolleger, utbrent, sykmeldt, ferie · skatt, samfunnet, forbrukslån, prioritere, fordele.", "Balanse (C): jobbe mye gir penger og karriere, men man blir sliten og får lite tid til familie. Landing: balanse mellom jobb og fritid.", "Skatt-chunk (Fredrik): «De pengene kan brukes til eldreomsorg og støtte til barn. Staten må prioritere og fordele pengene til de som trenger dem mest.»", "Chunks: «Det finnes undersøkelser som viser at…» · «mer effektive og kreative» · «I tillegg må staten…»", "Om meg (bruk dette): Jeg jobber som operations lead i et IT-firma. Jeg jobber med sikkerhet og skyinfrastruktur, hjelper utviklerne videre og tar de vanskelige kundesakene. Vi er et remote-team: jeg er på kontoret to dager i uka og jobber hjemmefra resten. Vi bruker Slack, og ringer hvis noe er akutt. Kollegene mine er veldig flinke og hjelpsomme. Jeg har aldri studert IT — jeg er utdannet maskiningeniør og lærte IT av interesse. Derfor mener jeg at relevant utdanning ikke er så viktig, men høyere utdanning er viktig for utvikling og selvstendighet. Å jobbe 100 % er greit, så lenge man tar ferie for å hente seg inn. Ellers blir man utbrent — jeg måtte selv være sykmeldt på grunn av spenningshodepine. Skatt: jeg betaler gjerne skatt når pengene går til samfunnet — transport, skole, helse. Men jeg liker ikke at skatten går til folk som går konkurs på grunn av forbrukslån til mobiler, reiser og klær.", "B — Trenger man utdanning for jobb? · jeg: maskiningeniør som lærte IT selv → relevant utdanning ikke viktig, høyere utdanning viktig", "C — Positivt/negativt å jobbe mye? · 100 % er ok med ferie; ellers utbrent — sykmeldt for spenningshodepine", "C — Bør ungdommer ta utdanning? · flere muligheter; yrkesfag også bra", "C — Bør småbarnsfamilier ha kortere arbeidsdag med full lønn? (Elis liste) · 4-dagers uke: undersøkelser, energi, produktive; mot: koster for firma", "C — Bør de som tjener mye betale mer skatt? (Fredrik kl. 10) · ja til transport/skole/helse; nei til forbrukslån; prioritere/fordele", "A — Hva gjør du på arbeidsplassen din? (Elis liste) · operations lead: sikkerhet, sky, hjelpe utviklere, vanskelige kundesaker; remote, 2 dager kontor, Slack; flinke kolleger"], "questions": [{"form": "B", "q": "Trenger man utdanning for jobb?", "angle": "jeg: maskiningeniør som lærte IT selv → relevant utdanning ikke viktig, høyere utdanning viktig"}, {"form": "C", "q": "Positivt/negativt å jobbe mye?", "angle": "100 % er ok med ferie; ellers utbrent — sykmeldt for spenningshodepine"}, {"form": "C", "q": "Bør ungdommer ta utdanning?", "angle": "flere muligheter; yrkesfag også bra"}, {"form": "C", "q": "Bør småbarnsfamilier ha kortere arbeidsdag med full lønn? (Elis liste)", "angle": "4-dagers uke: undersøkelser, energi, produktive; mot: koster for firma"}, {"form": "C", "q": "Bør de som tjener mye betale mer skatt? (Fredrik kl. 10)", "angle": "ja til transport/skole/helse; nei til forbrukslån; prioritere/fordele"}, {"form": "A", "q": "Hva gjør du på arbeidsplassen din? (Elis liste)", "angle": "operations lead: sikkerhet, sky, hjelpe utviklere, vanskelige kundesaker; remote, 2 dager kontor, Slack; flinke kolleger"}], "answers": {"04-1": {"form": "B", "q": "Trenger man utdanning for jobb?", "text": "Jeg synes at relevant utdanning ikke alltid er viktig for å få jobb, men høyere utdanning er viktig. For eksempel er jeg utdannet maskiningeniør, men jeg jobber med IT. Jeg jobber med sikkerhet og skyinfrastruktur i et IT-firma. IT lærte jeg selv, fordi jeg var interessert. Det utdanningen ga meg, var å lære å tenke og løse problemer, og det bruker jeg hver dag. Derfor mener jeg at høyere utdanning er viktig for utvikling og selvstendighet, selv om man ikke jobber med akkurat det man studerte. På den andre siden kjenner jeg folk uten utdanning som er veldig flinke, fordi de har mye erfaring. I IT er erfaring ofte viktigere enn papirer. Hva synes du? Er erfaring viktigere enn utdanning i ditt yrke?"}, "04-2": {"form": "C", "q": "Positivt/negativt å jobbe mye?", "text": "Jeg synes at det er greit å jobbe 100 %, så lenge man tar ferie og har balanse. Det mener jeg fordi man trenger pauser for å hente seg inn. Hvis man jobber fulltid uten ferie, blir man utbrent. Det positive med å jobbe mye er at man tjener penger, man utvikler seg, og man får mer ansvar. Jeg liker jobben min, og jeg lærer noe nytt hver uke. Det negative er at man blir sliten, og familien får mindre tid. For eksempel måtte jeg selv være sykmeldt på grunn av spenningshodepine da jeg jobbet for mye. Jeg tok ikke nok pauser, og til slutt sa kroppen stopp. Da lærte jeg at det ikke lønner seg å jobbe hele tiden. Nå jobber jeg to dager på kontoret og resten hjemmefra. Det gir bedre balanse. Jeg kan hente datteren min i barnehagen og spise middag med familien. I tillegg tar jeg ferie i august, og i år var jeg i Pakistan uten å tenke på jobb. For første gang på lenge koblet jeg helt av, og det ga meg mye energi. På den andre siden finnes det undersøkelser som viser at folk blir mer effektive når de jobber fire dager i uka. Det tror jeg på. Man jobber bedre når man er uthvilt. Alt i alt handler det om balanse mellom jobb og fritid. Fulltid er greit, men ferien er ikke luksus, den er nødvendig."}, "04-3": {"form": "C", "q": "Bør ungdommer ta utdanning?", "text": "Ja, jeg synes at ungdommer bør ta utdanning, men det trenger ikke være universitet for alle. Det mener jeg fordi utdanning gir flere muligheter og gjør dem mer selvstendige. Med utdanning kan man velge jobb, ikke bare ta den jobben man får. For eksempel studerte jeg maskinteknikk i hjemlandet. I dag jobber jeg med IT, ikke med maskiner. Men utdanningen lærte meg å tenke, å løse problemer og å jobbe selvstendig. Det bruker jeg hver dag på jobben. Derfor mener jeg at høyere utdanning er viktig for utvikling, selv om man ender i et annet yrke. I tillegg gir utdanning trygghet. Hvis man mister jobben, er det lettere å finne en ny. På den andre siden er yrkesfag også bra. Norge trenger elektrikere, snekkere og sykepleiere like mye som ingeniører. Noen lærer best ved å jobbe med hendene, ikke ved å lese bøker. Og noen ungdommer vet ikke hva de vil bli når de er seksten. Da er det bedre å jobbe et år og finne ut av det enn å begynne på noe man ikke liker. Jeg har også kolleger uten universitetsutdanning som er veldig flinke, fordi de har mye erfaring. Alt i alt synes jeg at det viktigste er at man fortsetter å lære, enten på skole eller i jobb. Men en grunnutdanning bør alle ta, fordi den åpner dører senere."}, "04-4": {"form": "C", "q": "Bør småbarnsfamilier ha kortere arbeidsdag med full lønn? (Elis liste)", "text": "Ja, jeg synes at småbarnsfamilier bør få kortere arbeidsdag, gjerne med full lønn. Det mener jeg fordi små barn trenger tid med foreldrene sine, og de første årene kommer ikke tilbake. Jeg har selv en datter på fem år og en baby på ni måneder, så jeg kjenner dette godt. Dagene er lange. Vi leverer i barnehagen om morgenen, jobber, henter, lager mat, legger barna, og så er dagen over. Det finnes undersøkelser som viser at folk blir mer effektive og kreative når de jobber mindre, for eksempel fire dager i uka. Det tror jeg på. Man jobber bedre når man er uthvilt og ikke har dårlig samvittighet for familien. For eksempel jobber jeg to dager på kontoret og resten hjemmefra. Da spar jeg reisetid, og jeg får gjort like mye. Jeg kan hente datteren min tidligere og spise middag med familien. Det gir bedre balanse, og jeg er mer fornøyd på jobb også. På den andre siden koster det penger for firmaet. Ikke alle jobber kan gjøres på seks timer. En sykepleier eller en bussjåfør kan ikke bare gå hjem tidlig. Så det må organiseres godt, og kanskje staten må hjelpe til med støtte. Alt i alt tror jeg at det lønner seg i lengden. Fornøyde foreldre er bedre arbeidere, og barna får en bedre start."}, "04-5": {"form": "C", "q": "Bør de som tjener mye betale mer skatt? (Fredrik kl. 10)", "text": "Ja, jeg synes at de som tjener mye, bør betale mer skatt, men pengene må brukes riktig. Det mener jeg fordi skatten bygger samfunnet vi alle bruker. De som tjener mye, har også fått mye fra samfunnet, for eksempel gratis skole og trygge veier. Da er det rettferdig at de gir litt mer tilbake. For eksempel går skatten til transport, skole og helsevesen. Da vi ventet babyen vår, var alt på sykehuset gratis. Datteren vår går i barnehage til en lav pris. Det er jeg glad for å betale skatt for. I Norge ser man faktisk resultatene av skatten, og det er ikke sånn i alle land. I tillegg må skatten hjelpe dem som trenger det mest, som eldre, syke og barn i fattige familier. På den andre siden liker jeg ikke at skatten går til folk som har tatt forbrukslån til mobiler, reiser og klær og så går konkurs. Det er ikke samfunnets ansvar å betale for luksus. Skatten må gå til det som er nødvendig, ikke til det som er valgt. Skatten må heller ikke bli så høy at folk mister lysten til å jobbe og tjene mer. Derfor må staten prioritere og fordele pengene til det som er viktig for alle. Helse, skole, transport og hjelp til de som virkelig trenger det. Alt i alt er høy skatt greit, hvis vi ser hva vi får for den."}, "04-6": {"form": "A", "q": "Hva gjør du på arbeidsplassen din? (Elis liste)", "text": "Jeg jobber som operations lead i et IT-firma i Oslo. På jobben jobber jeg med tre ting. Først sikkerhet, det vil si at systemene våre er trygge. Så skyinfrastruktur, altså serverne som alt kjører på. Og til slutt hjelper jeg utviklerne videre når de står fast. I tillegg tar jeg de vanskelige kundesakene, når kundene har problemer som supporten ikke klarer å løse. Så dagene er varierte. Ingen dag er lik. Vi er et remote-team. Det betyr at vi ikke sitter på samme kontor hver dag. Jeg er på kontoret to dager i uka og jobber hjemmefra resten. Vi bruker Slack for å snakke med hverandre, og hvis noe er akutt, ringer vi. Det fungerer bra, fordi vi stoler på hverandre. Kollegene mine er veldig flinke og hjelpsomme. Hvis jeg spør om hjelp, får jeg svar med en gang, og jeg gjør det samme for dem. Det jeg liker best med jobben, er at jeg lærer noe nytt hver uke. IT forandrer seg fort. Jeg er egentlig utdannet maskiningeniør, men jeg lærte IT selv fordi jeg var interessert, så for meg er jobben også en hobby. Det jeg liker mindre, er når det er mye press på én gang. Da blir det lange dager. Men to dager hjemmekontor gir god balanse, og jeg kan hente datteren min i barnehagen. Alt i alt er jeg veldig fornøyd med jobben min."}}}, "5": {"n": 5, "title": "Sosiale medier og mobil", "oversikt": ["Hva det handler om: mobilbruk, sosiale medier for unge, foreldre som begrenser skjermtid, leve uten smarttelefon.", "Nøkkelord: skjermtid, kontroll, til stede, én time om dagen · tablet, YouTube, lange reiser · overveldende, apper, varsler, ren skjerm · legge bort mobilen.", "Balanse (C): kontakt og læring på den ene siden, for mye skjerm, mindre søvn og lek på den andre.", "Chunks: «Det kommer an på hvordan man bruker den» · «For eksempel legger jeg bort mobilen når…» · «Uten mobil hadde vi…»", "Om meg (bruk dette): Vi bør ha kontroll over sosiale medier — både voksne og barn. Barna våre er for små til å ha mobil, men på lange reiser får datteren min en tablet med YouTube. Hjemme legger vi bort mobilen når vi er med barna. Hvis vi er fysisk til stede med dem, føler de ikke at de trenger skjerm — det holder i hvert fall til de begynner på skolen. Datteren min på fem år ser TV én gang om dagen på hverdager og to ganger i helgene og i sommerferien, aldri mer enn én time. Hun er helt fornøyd med det. Det krever mer tid fra oss som foreldre, men det er for utviklingen hennes, så vi finner den tiden. Mobilen er lett for den nye generasjonen — alt er ett klikk unna. På den andre siden er det overveldende med så mange apper, ikke bare for eldre, men også for meg. Jeg sletter ofte apper jeg ikke trenger, jeg liker en ren skjerm og har bare viktige varsler på.", "B — Bør foreldre begrense barnas mobil-tid? · datteren: TV én gang om dagen, maks én time; vi legger bort mobilen med barna", "C — Bør unge bruke sosiale medier? (for/imot) · kontakt og læring vs skjerm og fare", "C — Hva synes du om telefonbruk / bruk av sosiale medier? (Elis liste) · kontroll for voksne og barn; alt ett klikk unna vs overveldende — jeg sletter apper, bare viktige varsler", "C — Hadde vi klart å leve uten smarttelefon? (Elis liste) · ja, men vanskelig: bank, buss, kontakt; hypotetisk «hadde… ville…»"], "questions": [{"form": "B", "q": "Bør foreldre begrense barnas mobil-tid?", "angle": "datteren: TV én gang om dagen, maks én time; vi legger bort mobilen med barna"}, {"form": "C", "q": "Bør unge bruke sosiale medier? (for/imot)", "angle": "kontakt og læring vs skjerm og fare"}, {"form": "C", "q": "Hva synes du om telefonbruk / bruk av sosiale medier? (Elis liste)", "angle": "kontroll for voksne og barn; alt ett klikk unna vs overveldende — jeg sletter apper, bare viktige varsler"}, {"form": "C", "q": "Hadde vi klart å leve uten smarttelefon? (Elis liste)", "angle": "ja, men vanskelig: bank, buss, kontakt; hypotetisk «hadde… ville…»"}], "answers": {"05-1": {"form": "B", "q": "Bør foreldre begrense barnas mobil-tid?", "text": "Ja, jeg synes at foreldre bør begrense skjermtiden til barna, og det gjør vi hjemme. Det mener jeg fordi barn ikke trenger skjerm når foreldrene er til stede. Hvis vi er fysisk sammen med dem, leker og snakker, føler de ikke at de trenger mobilen. For eksempel ser datteren min på fem år TV én gang om dagen på hverdager, og to ganger i helgene og i ferien, aldri mer enn én time. Hun er helt fornøyd med det, fordi det alltid har vært sånn. Vi legger også bort mobilen når vi er med barna. Det krever mer tid fra oss som foreldre, men det er for utviklingen hennes, så vi finner den tiden. På den andre siden kan mobilen være nyttig. På lange reiser får hun en tablet med YouTube, og det gjør reisen lettere for alle. Så det handler ikke om null skjerm, men om kontroll. Hva synes du? Hvor mye skjerm får barna dine?"}, "05-2": {"form": "C", "q": "Bør unge bruke sosiale medier? (for/imot)", "text": "Jeg synes at unge kan bruke sosiale medier, men med kontroll og i riktig alder. Det mener jeg fordi sosiale medier har både gode og dårlige sider. Det gode er kontakt og informasjon. Unge kan snakke med venner, lære nye ting og følge med på det som skjer. Alt er ett klikk unna. Det dårlige er at det fort blir for mye. Man sitter for lenge, sover for lite, og man sammenligner seg med andre hele tiden. Det er ikke bra for hodet, spesielt for unge som ikke er ferdig utviklet. For eksempel er barna våre for små til å ha mobil, men vi tenker allerede på dette. Hjemme legger vi bort mobilen når vi er med barna. Da ser de at vi ikke trenger skjermen hele tiden, og de føler ikke at de trenger den heller. Datteren min på fem år ser TV én time om dagen og er fornøyd med det. Jeg tror at hvis barn får en god start uten skjerm, blir det lettere når de blir tenåringer. Jeg merker det på meg selv også. Med for mange apper blir det overveldende, så jeg sletter det jeg ikke trenger og har bare viktige varsler på. Hvis det er vanskelig for en voksen, er det enda vanskeligere for en fjortenåring. Alt i alt synes jeg at unge kan bruke sosiale medier, men foreldrene må sette grenser, og det bør begynne tidlig. Det handler om kontroll, både for barn og voksne."}, "05-3": {"form": "C", "q": "Hva synes du om telefonbruk / bruk av sosiale medier? (Elis liste)", "text": "Jeg synes at telefon og sosiale medier er nyttige, men vi må ha kontroll over bruken, både voksne og barn. Det mener jeg fordi mobilen fort tar over hverdagen hvis vi ikke passer på. Det positive er at alt er ett klikk unna. Bank, buss, legetime, kontakt med familien i Pakistan, alt ligger i lomma. For den nye generasjonen er dette helt naturlig. På den andre siden blir det fort overveldende. Det er så mange apper, varsler og meldinger at man ikke får ro. Det er ikke bare et problem for eldre. Jeg merker det på meg selv. For eksempel går jeg ofte gjennom mobilen og sletter apper jeg ikke trenger. Jeg liker en ren skjerm, og jeg har bare viktige varsler på. Da bestemmer jeg når jeg bruker mobilen, ikke mobilen som bestemmer over meg. Hjemme legger vi bort mobilen når vi er med barna. Da er vi til stede, og barna ser at vi ikke trenger skjermen hele tiden. Datteren min på fem år ser TV én time om dagen og er fornøyd med det. Sosiale medier bruker jeg lite. Jeg holder kontakt med familie og venner på WhatsApp, men jeg sitter ikke og scroller. Alt i alt synes jeg at mobilen er et verktøy, ikke en vane. Bruk den når du trenger den, og legg den bort når du er med folk."}, "05-4": {"form": "C", "q": "Hadde vi klart å leve uten smarttelefon? (Elis liste)", "text": "Ja, jeg tror at vi hadde klart å leve uten smarttelefon, men det hadde vært vanskelig i dag. Det mener jeg fordi hele samfunnet er bygget rundt mobilen nå. Bank, buss, legetime, barnehage-appen, alt er på mobilen. Uten den må man gå til banken, kjøpe papirbillett og ringe legen. Det går, men det tar tid. For eksempel bruker jeg mobilen til jobb også. Vi er et remote-team, og hvis noe er akutt, ringer kollegene meg. Uten mobil hadde det vært vanskelig å jobbe hjemmefra. På den andre siden hadde vi vært mer til stede uten smarttelefon. Vi hadde snakket mer med hverandre og sett mer på barna og mindre på skjermen. For eksempel legger vi bort mobilen hjemme når vi er med barna, og det fungerer fint. Vi savner den ikke. Da jeg var barn i Pakistan, hadde vi ikke smarttelefoner, og vi lekte ute hele dagen. Vi hadde det bra. Hvis vi ikke hadde hatt mobil, ville vi kanskje hatt bedre søvn og mer ro i hodet. Jeg merker selv at for mange apper og varsler blir overveldende, så jeg sletter det jeg ikke trenger. Alt i alt tror jeg at vi trenger mobilen i dag, men ikke hele tiden. Det viktigste er at vi bestemmer over mobilen, og ikke mobilen over oss."}}}, "6": {"n": 6, "title": "Venner og naboer", "oversikt": ["Hva det handler om: beskrive en person du kjenner, hva som gjør et godt vennskap, gode naboer.", "Nøkkelord: mentor, sjef, ansvar, mulighet, vokse, nyutdannet · stole på, miste kontakten, WhatsApp, i nærheten · hente i barnehagen, passe på, invitere, eid, bursdag, arrangement.", "Ryggrad (A): hvem → hvordan jeg kjenner personen → 2–3 adjektiver → hva vi gjør → hvorfor personen betyr noe.", "Chunks: «Hun er en person som…» · «Det jeg liker best med ham er…» · «Gode naboer gjør at man føler seg trygg»", "Om meg — eldre person (bruk dette): Den eldre personen jeg vil fortelle om, er den første sjefen min. Han var mentoren min og hjalp meg mye i utviklingen min. Han ga oss muligheten til å vokse ved å la oss ta ansvar for kunder direkte — uansett om vi var nyutdannet eller senior. På grunn av ham fikk jeg sitte i store møter og prosjekter i Dubai og Qatar med store selskaper. Han er veldig vennlig, og vi kan snakke om alt — jobb, familie og livserfaringene hans.", "Om meg — vennskap: En god venn er vennlig og en man kan stole på. Selv om vi møtes etter flere år, føles det som om det var i går — det er ekte vennskap. Noen ganger mister vi kontakten fordi vi bor i forskjellige land, men det går bra nå med WhatsApp. Hvis man vil møte venner fysisk, må de bo i nærheten, ellers blir det som langdistansevenner, og lysten til å møtes forsvinner — spesielt når man har barn.", "Om meg — naboer: Gode naboer er vennlige, hjelpsomme og noen du kan stole på. Naboene våre hjalp oss da vi var på sykehuset for fødselen av babyen: de hentet datteren vår i barnehagen og passet på henne. Vi lar også barna gå til hverandre for å leke, så den andre kan konsentrere seg om noe de ikke får gjort med barn rundt seg. Vi inviterer hverandre på eid og bursdager, og om sommeren går vi på arrangementer i nærheten så barna kan ha det gøy sammen.", "A — Fortell om en eldre person du kjenner · første sjef = mentor; ansvar for kunder, Dubai/Qatar; vennlig, snakker om alt", "B — Hva er viktig for et godt vennskap? · stole på; møtes etter år = som i går; WhatsApp; må bo i nærheten, spesielt med barn", "C — Viktig med gode naboer når du flytter? · naboene hentet datteren i barnehagen under fødselen; barna leker hos hverandre; eid, bursdager"], "questions": [{"form": "A", "q": "Fortell om en eldre person du kjenner", "angle": "første sjef = mentor; ansvar for kunder, Dubai/Qatar; vennlig, snakker om alt"}, {"form": "B", "q": "Hva er viktig for et godt vennskap?", "angle": "stole på; møtes etter år = som i går; WhatsApp; må bo i nærheten, spesielt med barn"}, {"form": "C", "q": "Viktig med gode naboer når du flytter?", "angle": "naboene hentet datteren i barnehagen under fødselen; barna leker hos hverandre; eid, bursdager"}], "answers": {"06-1": {"form": "A", "q": "Fortell om en eldre person du kjenner", "text": "Jeg vil fortelle om den første sjefen min. Han er en eldre mann, og han var mentoren min da jeg var nyutdannet ingeniør. Jeg jobbet for ham i mitt første firma, og han betyr fortsatt mye for meg. Han er vennlig, tålmodig og veldig hjelpsom. Han hjalp meg mye i utviklingen min. Det spesielle med ham var at han ga alle muligheten til å vokse. For eksempel lot han oss ta ansvar for kunder direkte, uansett om vi var nyutdannet eller senior. Han sa at man lærer bare ved å prøve. På grunn av ham fikk jeg sitte i store møter og jobbe i prosjekter i Dubai og Qatar med store selskaper. Jeg var ung og nervøs, men han stolte på meg, og det gjorde at jeg stolte på meg selv. Vi har fortsatt kontakt. Vi kan snakke om alt, fra jobb og familie til livserfaringene hans. Han har levd lenge og sett mye, og han gir gode råd uten å presse. Når jeg har et vanskelig valg på jobb, tenker jeg ofte på hva han ville sagt. I dag er jeg selv leder, og jeg prøver å gjøre det samme som han gjorde for meg. Jeg gir folk ansvar tidlig og hjelper dem når de står fast. Derfor betyr han mye for meg. Han var ikke bare en sjef, han var en lærer."}, "06-2": {"form": "B", "q": "Hva er viktig for et godt vennskap?", "text": "For meg er en god venn først og fremst en man kan stole på. Man skal kunne si alt uten å være redd for at det kommer videre. Det andre er at vennskapet holder over tid. Selv om vi møtes etter flere år, føles det som om det var i går. Da vet man at det er ekte vennskap. Noen ganger mister vi kontakten fordi vi bor i forskjellige land. Vennene mine er i Pakistan, i Dubai og i England. Men nå har vi WhatsApp, så vi snakker likevel. Det er lettere enn før. På den andre siden, hvis man vil møte venner fysisk, må de bo i nærheten. Ellers blir det som langdistansevenner, og lysten til å møtes forsvinner, spesielt når man har barn. Hva synes du er viktigst i et vennskap? Har du venner fra hjemlandet ditt fortsatt?"}, "06-3": {"form": "C", "q": "Viktig med gode naboer når du flytter?", "text": "Ja, jeg synes at gode naboer er veldig viktige, spesielt når man flytter til et nytt sted. Det mener jeg fordi naboene er de som er nærmest når noe skjer. Familien vår er i Pakistan, så vi har ingen besteforeldre i nærheten. Da blir naboene nesten som familie. For eksempel hjalp naboene våre oss da vi var på sykehuset for fødselen av babyen vår. De hentet datteren vår i barnehagen og passet på henne til vi kom hjem. Uten dem hadde det vært veldig vanskelig. Det glemmer vi aldri. I tillegg leker barna hos hverandre. Noen ganger går datteren vår til naboen og leker, så vi kan konsentrere oss om noe vi ikke får gjort med barn rundt oss. Og vi gjør det samme for dem. Vi inviterer også hverandre på viktige dager. De kommer til oss på eid, og vi går til dem på bursdager. Om sommeren går vi sammen på arrangementer i nærheten, så barna kan ha det gøy sammen. Gode naboer bør være vennlige, hjelpsomme og noen man kan stole på. Man trenger ikke å være beste venner, men man må kunne ringe på døra når noe skjer. På den andre siden må man også gi noe selv. Man må ta det første skrittet, hilse og hjelpe. Alt i alt gjør gode naboer at man føler seg trygg, og for en innvandrerfamilie er det ekstra viktig."}}}, "7": {"n": 7, "title": "Innvandring, språk og kultur", "oversikt": ["Hva det handler om: tradisjoner fra hjemlandet, om nordmenn gjør nok for innvandrere, ta vare på egen kultur, lære norsk, bo i Norge.", "Nøkkelord: ramadan, faste, be, søtsaker, gaver, eidi · første møte, komme nærmere, åpne, ta et skritt · morsmål, tradisjoner, respektere · sosial krets, bo alene · menneskevennlig, resultater, lys sommer, kulde · legevakt, nødsituasjon, T-bane.", "Balanse (C): beholde egen kultur OG være åpen for norsk. Nordmenn er hyggelige, men litt reserverte — begge må ta et skritt.", "Chunks: «For å forstå kultur og tradisjon i Norge» · «kontakt med norsk på daglig basis» · «Vi feirer både Eid og norske dager»", "Om meg — eid: Eid er den religiøse festen vi feirer etter ramadan. Vi faster i en måned, og så kommer eid. Først ber vi, og så møter vi familie og venner. Vi spiser søtsaker og gir gaver til hverandre, og barna får penger — det heter eidi.", "Om meg — nordmenn: Nordmenn er hyggelige ved første møte, men etterpå er det ikke lett å komme nærmere. De eneste nordmennene jeg kjenner, er fra jobben og fra barnehagen, og jeg tror det er fordi de må — ikke fordi de er åpne personlig. Jeg har lest et sted at det er lett å bli norsk (lære språket og samfunnskunnskap), men ikke lett å bli en del av nordmenn. Så begge sider må ta et skritt.", "Om meg — kultur: Det er bra å ta med seg kulturen sin, fordi barna ikke lærer den hvis de ikke kjenner den. Derfor snakker vi morsmålet vårt med barna og feirer tradisjonene våre. Men det betyr ikke at vi ignorerer det norske — vi bor her, så vi må respektere norske tradisjoner og ta til oss det vi kan.", "Om meg — eldre og norsk: Eldre trenger ikke å lære norsk hvis de ikke vil. Men hvis de gjør det, blir den sosiale kretsen større — spesielt hvis de bor alene, eller barna er ute mesteparten av dagen.", "Om meg — bo i Norge: Å bo i Norge er bra, sunt og menneskevennlig. Staten gjør faktisk ting for samfunnet. Skatten er høy, men vi ser resultatene — for eksempel i helsevesenet når det er akutt med gravide, og i barnehage og skole. Vinteren er litt vanskelig med kulde og snø. Sommeren er veldig lys, og det er fint — helt til barna skal sove. De skjønner ikke om det er natt eller dag når sola er oppe hele tiden.", "Om meg — kollektivtransport: Det er bedre å bruke kollektivtransport, med mindre man virkelig trenger bil. Nå føler vi at vi trenger bil, fordi vi har to barn. En gang i vinter måtte vi til legevakten, og vi brukte nesten fire timer på transport. Da kjente vi at bil er bedre enn buss og T-bane i en nødsituasjon.", "A — En tradisjonell fest fra hjemlandet · eid etter ramadan: be, familie/venner, søtsaker, gaver, eidi til barna", "B — Gjør nordmenn nok for innvandrere? · hyggelige ved første møte, vanskelig etterpå; kjenner bare fra jobb/barnehage; lett å bli norsk, vanskelig å bli en del av nordmenn", "C — Ta vare på kulturen fra hjemlandet? · morsmål + tradisjoner med barna, men respektere det norske", "C — Skal eldre innvandrere lære norsk? / Må alle velge selv? (Fredrik kl. 10, Elis liste) · velge selv, men større sosial krets — spesielt hvis de bor alene; hukommelse", "A — Hvordan er det å bo i Norge? (Elis liste) · sunt, menneskevennlig, staten leverer for skatten; vinter vanskelig; lys sommer — barna skjønner ikke natt/dag", "C — Kollektivtransport eller bil? / Hvordan oppfører nordmenn seg på bussen? (Elis liste) · kollektiv til man må ha bil: to barn, fire timer til legevakten i vinter; nordmenn: stille, høflige, avstand"], "questions": [{"form": "A", "q": "En tradisjonell fest fra hjemlandet", "angle": "eid etter ramadan: be, familie/venner, søtsaker, gaver, eidi til barna"}, {"form": "B", "q": "Gjør nordmenn nok for innvandrere?", "angle": "hyggelige ved første møte, vanskelig etterpå; kjenner bare fra jobb/barnehage; lett å bli norsk, vanskelig å bli en del av nordmenn"}, {"form": "C", "q": "Ta vare på kulturen fra hjemlandet?", "angle": "morsmål + tradisjoner med barna, men respektere det norske"}, {"form": "C", "q": "Skal eldre innvandrere lære norsk? / Må alle velge selv? (Fredrik kl. 10, Elis liste)", "angle": "velge selv, men større sosial krets — spesielt hvis de bor alene; hukommelse"}, {"form": "A", "q": "Hvordan er det å bo i Norge? (Elis liste)", "angle": "sunt, menneskevennlig, staten leverer for skatten; vinter vanskelig; lys sommer — barna skjønner ikke natt/dag"}, {"form": "C", "q": "Kollektivtransport eller bil? / Hvordan oppfører nordmenn seg på bussen? (Elis liste)", "angle": "kollektiv til man må ha bil: to barn, fire timer til legevakten i vinter; nordmenn: stille, høflige, avstand"}], "answers": {"07-1": {"form": "A", "q": "En tradisjonell fest fra hjemlandet", "text": "Jeg vil fortelle om eid, den viktigste festen vår. Eid er den religiøse festen vi feirer etter ramadan. I ramadan faster vi i en måned. Det betyr at vi ikke spiser eller drikker fra sola går opp til sola går ned. Det er tungt, spesielt i Norge om sommeren når dagene er lange. Og så kommer eid, og da feirer vi. Dagen begynner tidlig. Først tar vi på oss nye, fine klær. Så går vi til moskeen og ber sammen med mange andre. Etter bønnen gratulerer alle hverandre og gir hverandre en klem. Så møter vi familie og venner. Vi spiser mye god mat, spesielt søtsaker. Barna får penger fra de voksne. Det heter eidi, og barna gleder seg til det hele året. Datteren min på fem år teller pengene sine og er veldig stolt. Vi gir også gaver til hverandre. I Pakistan er eid enda større. Hele byen feirer, og man besøker mange familier på én dag. I Norge er det roligere, men vi feirer med venner og naboer her. Noen av de norske naboene våre kommer også og smaker på maten. Det setter vi stor pris på. Derfor er eid den fineste dagen i året for oss. Det er en dag for takknemlighet, familie og glede, og det er viktig for oss at barna lærer den tradisjonen."}, "07-2": {"form": "B", "q": "Gjør nordmenn nok for innvandrere?", "text": "Jeg synes at nordmenn gjør en del, men det er ikke nok, og det er ikke bare deres skyld. Nordmenn er hyggelige ved første møte. De smiler og hjelper hvis du spør. Men etterpå er det ikke lett å komme nærmere. For eksempel er de eneste nordmennene jeg kjenner, fra jobben og fra barnehagen. Og jeg tror at det er fordi vi må møtes der, ikke fordi de er åpne personlig. Jeg har lest et sted at det er lett å bli norsk, altså lære språket og samfunnskunnskap, men ikke lett å bli en del av nordmenn. Det stemmer med min erfaring. På den andre siden må vi innvandrere også ta et skritt. Vi kan ikke bare vente på at de kommer til oss. Hva synes du? Har du norske venner utenfor jobben?"}, "07-3": {"form": "C", "q": "Ta vare på kulturen fra hjemlandet?", "text": "Ja, jeg synes at det er viktig å ta vare på kulturen fra hjemlandet, men uten å lukke døra til den norske. Det mener jeg fordi barna ikke lærer kulturen hvis de ikke ser den hjemme. Hvis vi ikke viser dem den, forsvinner den på én generasjon. For eksempel snakker vi morsmålet vårt med barna hjemme. Norsk lærer de i barnehagen uansett, men morsmålet kan de bare lære av oss. Uten språket kan de ikke snakke med besteforeldrene i Pakistan. I tillegg feirer vi eid med familie og venner. Vi faster i ramadan, vi ber, og barna får eidi. Datteren min på fem år gleder seg til det hele året. Det er identiteten hennes. På den andre siden bor vi i Norge, så vi må også respektere norske tradisjoner og ta til oss det vi kan. Vi feirer 17. mai med barnehagen, vi går på ski om vinteren, og vi inviterer norske naboer på eid. Barna skal føle at de hører til begge steder, ikke ingen av dem. Jeg tror at det gjør dem sterkere. De får to språk, to kulturer og flere måter å se verden på. Det er en fordel, ikke et problem. Alt i alt handler det om begge deler. Man kan være stolt av hvor man kommer fra, og samtidig være en del av landet man bor i."}, "07-4": {"form": "C", "q": "Skal eldre innvandrere lære norsk? / Må alle velge selv? (Fredrik kl. 10, Elis liste)", "text": "Jeg synes at eldre skal få velge selv om de vil lære norsk, men jeg vil anbefale dem å prøve. Det mener jeg fordi det er vanskelig å lære et nytt språk når man er sytti år. Hodet er ikke like raskt, og mange eldre har kommet på grunn av krig eller for å bo med barna sine, ikke fordi de valgte det. Da er det ikke rettferdig å tvinge dem. På den andre siden blir livet bedre hvis de lærer litt norsk. Den sosiale kretsen blir større. De kan snakke med naboen, handle selv og gå til legen uten tolk. Det er spesielt viktig hvis de bor alene, eller hvis barna er ute på jobb hele dagen. Uten språket blir de isolert hjemme. For eksempel kjenner jeg eldre i miljøet vårt som bare snakker med familien. De ser TV fra hjemlandet hele dagen og går sjelden ut. Det er ikke et godt liv. I tillegg er det bra for hukommelsen å øve. Læreren min sa at å lære språk hjelper hodet å holde seg i form. Man trenger ikke å bli perfekt. Noen setninger om vær, mat og familie er nok til å hilse på naboen. Alt i alt bør eldre prøve, fordi det gir dem et større liv her. Men det må være et valg, ikke et krav, og de trenger tålmodige lærere."}, "07-5": {"form": "A", "q": "Hvordan er det å bo i Norge? (Elis liste)", "text": "Å bo i Norge er bra, sunt og menneskevennlig. Jeg har bodd her i flere år nå, og jeg er glad for at vi valgte Norge. Det første jeg vil si, er at staten faktisk gjør ting for samfunnet. Skatten er høy, men vi ser resultatene. For eksempel var alt gratis på sykehuset da vi ventet babyen vår. Datteren vår går i barnehage til en lav pris, og skolen er gratis. Veiene er trygge, og bussen kommer når den skal. I hjemlandet mitt betaler man mindre skatt, men man får også mye mindre tilbake. Det andre er naturen. Frisk luft, skog og fjord like ved. Man kan gå tur rett fra døra, og det er gratis. Det er veldig bra for helsa og for hodet. På den andre siden er vinteren litt vanskelig. Det er kaldt, mørkt og mye snø, og med to små barn tar det lang tid å komme ut døra. Sommeren er veldig lys, og det er fint, helt til barna skal sove. De skjønner ikke om det er natt eller dag når sola er oppe hele tiden. Det er også dyrt her, så vi handler på salg og drar til Sverige for kjøtt og ost. Og det tar tid å få norske venner. Nordmenn er hyggelige, men litt reserverte. Alt i alt er jeg glad for at vi bor her. Det er et trygt og godt land å oppdra barn i."}, "07-6": {"form": "C", "q": "Kollektivtransport eller bil? / Hvordan oppfører nordmenn seg på bussen? (Elis liste)", "text": "Jeg synes at det er bedre å bruke kollektivtransport, med mindre man virkelig trenger bil. Det mener jeg fordi det er billigere og bedre for miljøet. I Oslo fungerer buss og T-bane godt. De kommer ofte, og man kan lese eller slappe av på veien. Man trenger ikke å lete etter parkering, og bensin og forsikring er dyrt. Jeg tar T-banen til kontoret de to dagene jeg er der, og det er enkelt. På den andre siden føler vi nå at vi trenger bil, fordi vi har to barn. For eksempel måtte vi til legevakten en gang i vinter. Det var kaldt, det var sent, og vi brukte nesten fire timer på transport med et sykt barn. Da kjente vi at bil er bedre i en nødsituasjon. Med bil hadde det tatt tjue minutter. Det samme gjelder når vi skal handle stort eller reise med barnevogn og bagasje. Så jeg tror at svaret er begge deler. Kollektivtransport i hverdagen, til jobb og i byen. Bil når det er nødvendig, med små barn, i nødsituasjoner og på lange turer. Det er også fint at nordmenn er rolige og høflige på bussen. Folk er stille, holder avstand og gir plass til barnevogner. Alt i alt kommer det an på situasjonen. Uten barn trengte vi ikke bil, men med to små ser vi behovet."}}}, "8": {"n": 8, "title": "Miljø, forbruk og penger", "oversikt": ["Hva det handler om: kaste mindre mat og klær, dyrt og billig i Norge, hva staten skal bruke penger på.", "Nøkkelord: kaste, produsere, forurensning, reparere, bruke videre, cargo · salg, cashback, trippel-Trumf, Sverige, nødvendig · staten, helse, transport, NAV, overbelastet, hjemmeværende, prioritere.", "Kjede (C): kaste mye → produsere mye → forurensning. Løsning: kjøpe mindre, reparere, kjøpe brukt.", "Chunks: «Hvis vi kjøper og kaster mye, produseres det mye» · «Staten må prioritere de som trenger det mest» · «i stedet for å…»", "Om meg — kaste mindre: Noen venner av meg sender ødelagt elektronikk til hjemlandet med cargo. Familien der reparerer den og bruker den videre. Det er billig å reparere der, og tingene blir brukt igjen i stedet for å kastes.", "Om meg — dyrt og billig: Ikke alt er dyrt i Norge, men det føles sånn. Vi sparer penger ved å handle når det er salg, eller på trippel-Trumf-dager for å få mer cashback. De fleste appene gir cashback nå, og det hjelper. Vi drar til Sverige for stor handel — kjøtt, ost og sånne ting — men bare når det er nødvendig. Noen ganger blir den «billige» turen dyrere, fordi det er så mye å velge i, og man kjøper mer enn man trenger.", "Om meg — staten: Staten bør satse på helse, transport og flere muligheter for for eksempel hjemmeværende. NAV finnes, men de er alltid overbelastet, så staten må legge mer innsats der.", "C — Hva kan vi gjøre for å kaste mindre? · kjede + løsning; venner sender elektronikk til hjemlandet for reparasjon og gjenbruk", "C — Hva er dyrt og hva er billig i Norge? (Elis liste) · føles dyrt; salg, cashback-apper, trippel-Trumf; Sverige bare når nødvendig — billig tur kan bli dyr", "C — Hva skal staten bruke penger på? (Elis liste) · helse, transport, muligheter for hjemmeværende; NAV overbelastet"], "questions": [{"form": "C", "q": "Hva kan vi gjøre for å kaste mindre?", "angle": "kjede + løsning; venner sender elektronikk til hjemlandet for reparasjon og gjenbruk"}, {"form": "C", "q": "Hva er dyrt og hva er billig i Norge? (Elis liste)", "angle": "føles dyrt; salg, cashback-apper, trippel-Trumf; Sverige bare når nødvendig — billig tur kan bli dyr"}, {"form": "C", "q": "Hva skal staten bruke penger på? (Elis liste)", "angle": "helse, transport, muligheter for hjemmeværende; NAV overbelastet"}], "answers": {"08-1": {"form": "C", "q": "Hva kan vi gjøre for å kaste mindre?", "text": "Etter min mening må vi kjøpe mindre og kaste mindre, og det er lettere enn man tror. Det mener jeg fordi det som kastes, må først produseres. Produksjon krever energi og skaper forurensning. Så jo mer vi kaster, jo mer skader vi miljøet. Det første vi kan gjøre, er å reparere i stedet for å kjøpe nytt. For eksempel sender noen venner av meg ødelagt elektronikk til hjemlandet med cargo. Familien der reparerer den og bruker den videre. I Pakistan er det billig å reparere, og folk kaster ikke ting som kan fikses. I Norge kaster vi ofte en mobil bare fordi skjermen er sprukket. Det andre er å planlegge når vi handler. Vi handler på salg og kjøper bare det vi trenger. Når vi drar til Sverige for kjøtt og ost, lager vi en liste, ellers kjøper man for mye fordi det er så mye å velge i. Mat som kastes, er et stort problem, og planlegging hjelper. Det tredje er klær. Barn vokser fort, så vi gir klær videre til naboer og får klær tilbake. Det er normalt i miljøet vårt, og det sparer både penger og miljø. På den andre siden er det ikke alt man kan reparere, og noen ting er billigere å kjøpe nytt. Men vi kan tenke før vi kjøper. Alt i alt handler det om vaner. Kjøp mindre, reparer mer, og del med andre."}, "08-2": {"form": "C", "q": "Hva er dyrt og hva er billig i Norge? (Elis liste)", "text": "Jeg synes at ikke alt er dyrt i Norge, men det føles sånn, spesielt i begynnelsen. Det som er dyrt, er mat, restaurant, tannlege og bolig. En middag ute for en familie koster fort tusen kroner. Derfor lager vi mat hjemme nesten hver dag. Det som er billig, eller gratis, er det staten gir. Skole, sykehus for barn og gravide, og naturen. Å gå tur i skogen koster ingenting. Vi har lært å spare penger på flere måter. For eksempel handler vi når det er salg, og på trippel-Trumf-dager for å få mer cashback. De fleste appene gir cashback nå, og det hjelper. Noen ganger drar vi til Sverige for stor handel, som kjøtt og ost. Kjøtt er viktig for oss, og det er mye billigere der. Norsk ost har lite smak og er dyr, så vi kjøper ost i Sverige også. På den andre siden kan den billige turen bli dyr. Det er så mye å velge i, at man kjøper mer enn man trenger. Så vi drar bare når det er nødvendig, og vi lager en liste. Det er også dyrt å ha bil, så vi bruker kollektivtransport i hverdagen. Alt i alt må man planlegge i Norge. Hvis man planlegger, er det ikke så dyrt som det føles. Lønnen er også høyere her, så det balanserer seg."}, "08-3": {"form": "C", "q": "Hva skal staten bruke penger på? (Elis liste)", "text": "Jeg synes at staten bør bruke pengene på helse, transport og skole, og på å gi folk muligheter. Det mener jeg fordi det er ting alle i samfunnet bruker, ikke bare noen få. Det første er helse. I Norge er sykehus gratis for barn og gravide, og det er veldig bra. Men tannlege er dyrt, og NAV er alltid overbelastet. Folk venter lenge på svar. Så staten må legge mer innsats der. Det andre er transport. Vi bruker kollektivtransport i hverdagen, og det fungerer bra i Oslo, men det må også fungere utenfor byen, så folk ikke trenger bil. Det tredje er skole og barnehage. Barna er framtiden, og god skole er den beste investeringen. I tillegg bør staten gi flere muligheter til folk som står utenfor arbeidslivet, for eksempel hjemmeværende. Mange innvandrerkvinner vil jobbe, men de trenger språk og en vei inn. Hvis staten hjelper dem, får de skatt tilbake senere. Det er smart. På den andre siden må pengene ikke gå til folk som har tatt forbrukslån til mobiler, reiser og luksus. Det er ikke samfunnets ansvar. Skatten er høy i Norge, og jeg betaler den gjerne, men jeg vil se at den går til nødvendige ting. Alt i alt må staten prioritere og fordele pengene til det som er viktig for alle, og til dem som virkelig trenger hjelp."}}}, "9": {"n": 9, "title": "Lykke og verdier (abstrakt)", "oversikt": ["Hva det handler om: «luftige» spørsmål uten learnnorsk-leksjon — lykke, digitalsamfunnet, hva som er viktig i livet.", "Sandwich (V): generisk («det finnes mange ting som gjør folk lykkelige») → konkret om meg («for eksempel blir jeg glad når jeg trener») → generisk igjen («alt i alt betyr familie mest»).", "Nøkkelord: lykkelig, glad, meningsfull jobb, familie, helse · digital booking, nettverk, rask info vs overveldende, digital kompetanse, eldre, personvern.", "Chunks: «Det kommer an på hva man mener med…» · «For meg personlig…» · «Alt i alt…»", "Om meg — lykke: For meg er lykke små ting i hverdagen — å trene, lage god mat og se barna leke. Familien er viktigst, spesielt nå med en baby på ni måneder. Nylig var jeg i Pakistan, og for første gang på lenge trengte jeg ikke å tenke på jobb. Det var en veldig god tur. Derfor mener jeg at det er viktig å koble helt av fra jobben. En meningsfull jobb med gode kolleger betyr også mye.", "Om meg — digitalsamfunnet: Alt er ett klikk unna — bank, buss, legetime. Men det blir fort overveldende, også for meg, så jeg sletter apper jeg ikke trenger og har bare viktige varsler på. For eldre er det enda vanskeligere.", "V — Hvordan kan vi bli lykkelige? · små ting i hverdagen; Pakistan-turen uten jobb → koble helt av", "V — Fordeler og ulemper med digitalsamfunnet? · booking/nettverk vs overveldende, vanskelig for eldre"], "questions": [{"form": "V", "q": "Hvordan kan vi bli lykkelige?", "angle": "små ting i hverdagen; Pakistan-turen uten jobb → koble helt av"}, {"form": "V", "q": "Fordeler og ulemper med digitalsamfunnet?", "angle": "booking/nettverk vs overveldende, vanskelig for eldre"}], "answers": {"09-1": {"form": "V", "q": "Hvordan kan vi bli lykkelige?", "text": "Det finnes mange ting som gjør folk lykkelige, og det kommer an på hva man mener med lykke. Noen tenker på penger og karriere. Andre tenker på familie og helse. Jeg tror at lykke er forskjellig for hver person, men noen ting er like for de fleste. For meg personlig er lykke små ting i hverdagen. Å trene på gym om morgenen, å lage god mat til familien, og å se barna leke. Datteren min på fem år som ler, eller babyen på ni måneder som lærer noe nytt. Det er de øyeblikkene jeg husker. For eksempel var jeg nylig i Pakistan, og for første gang på lenge tenkte jeg ikke på jobb. Jeg var bare der med familien, spiste god mat og slappet av. Da skjønte jeg hvor viktig det er å koble helt av. Man kan ikke være lykkelig hvis hodet alltid er på jobb. I tillegg betyr en meningsfull jobb med gode kolleger mye. Man bruker mange timer på jobb, så hvis man ikke liker den, er det vanskelig å være lykkelig. Jeg er heldig, jeg liker jobben min og kollegene mine. Helse er også grunnlaget. Uten helse hjelper ikke penger. På den andre siden gjør ikke mer penger deg lykkeligere når du har nok. Alt i alt tror jeg at familie, helse og tid uten stress er det viktigste for de fleste. Og man må ta seg tid til de små tingene."}, "09-2": {"form": "V", "q": "Fordeler og ulemper med digitalsamfunnet?", "text": "Digitalsamfunnet har både fordeler og ulemper, og jeg ser begge i hverdagen min. Den største fordelen er at alt er ett klikk unna. Bank, buss, legetime, barnehage-appen og kontakt med familien i Pakistan. For eksempel snakker vi med besteforeldrene på video hver uke, og barna kjenner dem selv om de bor langt unna. Det var ikke mulig før. I tillegg kan jeg jobbe hjemmefra. Vi er et remote-team, og uten digitale verktøy som Slack hadde det ikke gått. Det gir meg mer tid med familien. Så digitalsamfunnet gir frihet. På den andre siden blir det fort overveldende. Det er så mange apper, varsler og passord at man ikke får ro. Og det er ikke bare et problem for eldre. Jeg merker det selv. For eksempel sletter jeg ofte apper jeg ikke trenger, og jeg har bare viktige varsler på. Jeg liker en ren skjerm. For eldre er det enda vanskeligere. Foreldrene til venner av meg klarer ikke banken på mobil, og da trenger de hjelp til alt. Det er ikke rettferdig at samfunnet krever høy digital kompetanse av alle. Det er også et problem for barn. Vi begrenser skjermtiden hjemme, én time TV om dagen, fordi vi ser hva som skjer hvis vi ikke gjør det. Alt i alt er digitalsamfunnet bra, men vi må ha kontroll, og vi må hjelpe dem som faller utenfor."}}}, "10": {"n": 10, "title": "Fritid, natur og kjæledyr", "oversikt": ["Hva det handler om: gamle eksamensspørsmål fra Elis liste — nesten alt er Fortell (A): fritid, sommer, kjæledyr, natur, nyheter.", "Nøkkelord: trene, lage mat, gå tur, se film, være med familien · dro, var, spiste, badet (preteritum) · katt/hund: selskap, ansvar, koster, tar tid · frisk luft, fjell, fjord, mørkt, regn.", "Balanse (C): mye fritid er bra for helsa, men kan bli kjedelig. Nyheter: viktig å følge med, men ikke hele tiden.", "Chunks: «I fritiden liker jeg å…» · «I sommer dro vi til…» · «På den ene siden…, på den andre siden…»", "Om meg — fritid: I fritiden trener jeg på gym tre ganger i uka, lager mat og er med familien. Helgene går til barna: venner fra barnehagen, lekeplassen og arrangementer i nærheten om sommeren.", "Om meg — sommeren: Om sommeren jobber jeg vanligvis, og tar ferie i august når alle andre kommer tilbake. Da er det billigere å reise, og det er ikke så mange folk. Noen ganger drar vi til Pakistan, noen ganger til andre land i Europa, eller vi besøker søsteren min i England. Når vi er i Norge, tar jeg noen dager fri, og vi går til lekeplassen eller lekeland, så barna får brukt energien sin. I år dro vi til Pakistan, og for første gang på lenge trengte jeg ikke å tenke på jobb.", "Om meg — natur: Frisk luft, skog og fjord like ved — det er det beste med Norge. Vinteren er tung med kulde og snø. Den lyse sommeren er fin, men vanskelig for barnas søvn.", "Om meg — kjæledyr: Jeg er allergisk mot dyr, så vi har ikke kjæledyr nå. Men i Pakistan hadde vi katter. Vi ga dem mat og passet på dem, og de fikk kattunger, så det ble en hel familie. På søndager lagde vi mat til dem for hele uka. Det var gode tider. Noen av dem kom inn i rommet og gjemte seg under senga. Positivt: barn lærer ansvar, og det er godt selskap. Negativt: det koster, tar tid — og allergi.", "Om meg — nyheter: Jeg følger vanligvis ikke med på nyheter, fordi det bare er stressende nå, og man klarer ikke å konsentrere seg om noe. Jeg følger økonominyheter, fordi de forteller mye. Ellers sjekker jeg lokale nyheter og nyheter fra stedet jeg skal reise til, for å vite hvordan været er. Resten av tiden fokuserer jeg på jobb og familie.", "A — Hva liker du å gjøre i fritiden? · gym 3x, lage mat, familie; helgene: barna, lekeplass, arrangementer", "A — Hva gjorde du på fritiden om sommeren? · jobber om sommeren, ferie i august (billig, lite folk): Pakistan / Europa / søsteren i England; i Norge: lekeplass, lekeland; preteritum", "A — Fortell om et kjæledyr — katt eller hund (positivt og negativt) · allergisk nå; katter i Pakistan — kattunger, søndagsmat for hele uka, gjemte seg under senga", "B — Hva er positivt og negativt med naturen i Norge? · frisk luft, fjell vs kaldt, mørkt, regn", "C — Hva synes du om å ha mye fritid? · helse og familie vs kjedelig; balanse", "C — Hva synes du om å lese nyheter hele tiden? · følger lite — stressende; økonominyheter ja; lokalt + reisemål for været; fokus på jobb og familie"], "questions": [{"form": "A", "q": "Hva liker du å gjøre i fritiden?", "angle": "gym 3x, lage mat, familie; helgene: barna, lekeplass, arrangementer"}, {"form": "A", "q": "Hva gjorde du på fritiden om sommeren?", "angle": "jobber om sommeren, ferie i august (billig, lite folk): Pakistan / Europa / søsteren i England; i Norge: lekeplass, lekeland; preteritum"}, {"form": "A", "q": "Fortell om et kjæledyr — katt eller hund (positivt og negativt)", "angle": "allergisk nå; katter i Pakistan — kattunger, søndagsmat for hele uka, gjemte seg under senga"}, {"form": "B", "q": "Hva er positivt og negativt med naturen i Norge?", "angle": "frisk luft, fjell vs kaldt, mørkt, regn"}, {"form": "C", "q": "Hva synes du om å ha mye fritid?", "angle": "helse og familie vs kjedelig; balanse"}, {"form": "C", "q": "Hva synes du om å lese nyheter hele tiden?", "angle": "følger lite — stressende; økonominyheter ja; lokalt + reisemål for været; fokus på jobb og familie"}], "answers": {"10-1": {"form": "A", "q": "Hva liker du å gjøre i fritiden?", "text": "I fritiden liker jeg å trene, lage mat og være med familien. Med to små barn er det ikke så mye fritid, så jeg bruker den bevisst. For det første trener jeg på gym tre ganger i uka. Nå trener jeg lett, med push-ups, pull-ups med hjelp og planke i hver økt. Det er bra for kroppen, og det gir ro i hodet etter jobb. For det andre liker jeg å lage mat. Vi lager mat hjemme nesten hver dag, fordi det er dyrt å spise ute. Jeg lager gjerne mat med mye protein, men den må smake godt. Datteren min på fem år liker å hjelpe til på kjøkkenet, så det blir familietid også. For det tredje er helgene til barna. Vi går til lekeplassen, møter venner fra barnehagen eller går tur i skogen. Om sommeren går vi på arrangementer i nærheten sammen med naboene, så barna får brukt energien sin. I tillegg liker jeg å slappe av med en film når barna sover, men det blir ikke så ofte. Sosiale medier bruker jeg lite. Jeg holder kontakt med familie i Pakistan på WhatsApp. Det jeg savner litt, er å reise. Vi tar ferie i august, og i år var vi i Pakistan. Derfor er fritiden viktig for meg. Jeg får energi til jobben, og barna får tid med pappa. Det er nok for meg akkurat nå."}, "10-2": {"form": "A", "q": "Hva gjorde du på fritiden om sommeren?", "text": "Om sommeren jobber jeg vanligvis, og jeg tar ferie i august når alle andre kommer tilbake. Det gjør vi med vilje. Da er det billigere å reise, og det er ikke så mange folk på flyplassen og på stedene vi skal til. I juni og juli er kontoret rolig, så da får jeg gjort mye. I år dro vi til Pakistan i august og besøkte familien. Det var lenge siden vi var der. Barna var med besteforeldrene, og vi spiste mye god mat. Det beste var at jeg for første gang på lenge ikke trengte å tenke på jobb. Jeg slo av varslene og koblet helt av. Da skjønte jeg hvor viktig det er å ta ordentlig ferie. Andre år har vi reist til andre land i Europa, eller vi har besøkt søsteren min i England. Barna liker å reise, men lange turer er slitsomme med en baby. Når vi er i Norge om sommeren, tar jeg noen dager fri, og vi går til lekeplassen eller lekeland. Vi går også på arrangementer i nærheten sammen med naboene, så barna får brukt energien sin. Datteren min på fem år har veldig mye energi, og om sommeren, når barnehagen er stengt, må den ut et sted. Så sommeren handler om barna og om å hente meg inn. Etter ferien i Pakistan kom jeg tilbake med mye mer energi til jobben."}, "10-3": {"form": "A", "q": "Fortell om et kjæledyr — katt eller hund (positivt og negativt)", "text": "Jeg er allergisk mot dyr, så vi har ikke kjæledyr nå. Men da jeg bodde i Paki
